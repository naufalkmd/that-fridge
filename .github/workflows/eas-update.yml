name: EAS Update (OTA)

# Every merge to main that touches the app's JS ships an over-the-air update to the
# production channel. Installed TestFlight / App Store builds pick it up on next launch —
# no rebuild, no Apple review. Native changes (icon, permissions, native modules) still
# need a tagged build — see .github/workflows/testflight.yml and apps/mobile/CONTRIBUTING.md.
on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/eas-update.yml"
  workflow_dispatch:
    inputs:
      message:
        description: "Update message (shown in EAS)"
        required: false

concurrency:
  group: eas-update-production
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Typecheck (core + mobile)
        run: |
          (cd packages/core && node ../../node_modules/.bin/tsc --noEmit)
          (cd apps/mobile && node ../../node_modules/.bin/tsc --noEmit)
        working-directory: .

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: pnpm

      - name: Publish update
        env:
          # Full commit message can be multi-line — pass via env and take the first line.
          RAW_MSG: ${{ github.event.inputs.message || github.event.head_commit.message }}
          # `eas update` doesn't read eas.json build-profile env, so any EXPO_PUBLIC_* the app
          # needs must come from somewhere explicit or the bundle ships with it undefined (→
          # RevenueCat/API calls silently break, or - for RC - the SDK hard-crashes the app on
          # launch, mistaking "undefined" for a bogus key). The RC keys and
          # EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID live in EAS's hosted "production" environment
          # (`eas env:list --environment production`) and are pulled in below via
          # `eas env:exec` - do not remove that wrapper. EXPO_PUBLIC_API_URL and the iOS Google
          # client ID aren't in that store, so they're set here directly; keep them in sync with
          # eas.json's production build profile.
          EXPO_PUBLIC_API_URL: https://api.thatfridge.com/api
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: 354217060730-3jpu7mbm22mknqvs55523gikkmg7nru8.apps.googleusercontent.com
        run: |
          MSG="$(printf '%s' "$RAW_MSG" | head -1)"
          eas env:exec production "eas update --branch production --non-interactive --message \"$MSG\""

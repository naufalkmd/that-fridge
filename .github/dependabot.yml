# Dependabot watches every dependency manifest for known vulnerabilities and opens a PR
# when there's a fix. Security updates are raised regardless of the `schedule` below (that
# only paces the routine "a newer version exists" PRs). Minor/patch bumps are grouped into
# one PR per ecosystem to keep the noise down; majors come through one at a time.
version: 2
updates:
  - package-ecosystem: composer
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      backend-minor-patch:
        update-types: [minor, patch]

  # Root pnpm workspace: apps/mobile + packages/*
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      workspace-minor-patch:
        update-types: [minor, patch]

  # Legacy, frozen, npm-managed - still deployed, so still gets security fixes.
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      web-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
